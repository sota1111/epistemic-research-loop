name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          # mypy targets python_version = "3.11" (pyproject.toml); on 3.12 the
          # runner resolves numpy stubs that use 3.12-only `type` statements.
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --extra dev --extra solver --frozen
      - name: Run quality, replay, holdout, schema, secret, and dependency gates
        run: make ci
