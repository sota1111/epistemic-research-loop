# SIGNATE NEDO Challenge, Baggage-Loading Robot contest 2 -- run through the engine, not around it.
#
# docs/v050_course_correction.md §3 item 1: the engine has never been used in a campaign. This is
# the configuration for using it on one. What makes this competition different from every previous
# ERL target, and what most of the settings below are about:
#
#   * the submission is an ALGORITHM, not a prediction vector. The worker develops source code in
#     the competition's own repository, so the executor is `competition_repo` and the experiment
#     contract is a development brief rather than a command to run.
#   * the local scoring system is written by us. Apparatus class A1 (the local metric measures a
#     different quantity) and A2 (local exaggerates differences, slope 0.589) both apply and are
#     the reason the leaderboard budget below is small and the local score is never treated as the
#     estimate (docs/controller_reference/apparatus_taxonomy_layer2.md).
#   * real submissions are capped at 5/day by the platform and require explicit human approval
#     every time (docs/handover.md). `max_final_submissions: 0` keeps the loop from ever taking
#     that decision itself.
#
# Set NEDO_RUN_ID, NEDO_SEED and NEDO_REPO before `erlctl init`.
run:
  id: ${NEDO_RUN_ID}
  mode: system_c
  seed: ${NEDO_SEED}
competition:
  slug: nedo-baggage-loading
  metric_direction: maximize
  # The local composite. It is NOT the competition's score: the official weights are not published
  # and the fitted local->real relation is `public ~= 0.589 * local + 28.18` (v050_lessons §1.2).
  primary_metric: composite_score
  data_path: ${NEDO_REPO}/tasks
budgets:
  max_experiments: 12
  max_cpu_hours: 40
  max_gpu_hours: 0
  max_wall_hours: 24
  max_llm_tokens: 4000000
  max_cost: 0
  # The loop never submits. Every real submission is a separate, explicitly approved act.
  max_final_submissions: 0
  max_daily_submissions: 0
loop:
  phase_policy: adaptive
  max_active_hypotheses: 12
  max_priority_hypotheses: 6
  max_consecutive_optimization_experiments: 2
  minimum_replications_for_support: 1
  max_validation_reuse: 4
  max_rounds_without_information: 2
selection:
  cost_lambda: 0.15
  risk_lambda: 0.5
  minimum_utility: 0.0
  eig_method: monte_carlo
  eig_monte_carlo_samples: 2000
  discovery: {pragmatic: 0.20, epistemic: 0.45, robustness: 0.20, diversity: 0.15}
  consolidation: {pragmatic: 0.35, epistemic: 0.30, robustness: 0.25, diversity: 0.10}
  exploitation: {pragmatic: 0.55, epistemic: 0.15, robustness: 0.25, diversity: 0.05}
validation:
  # "Which local task set represents the hidden evaluation set" is the open question here, and it
  # is a real one: the agent task set scored +1.71 above the ranking set on the same design
  # (v050_lessons §1.5). `group` is per-task-family; `random` is a fresh draw of tasks.
  worlds: [random, group]
  require_forward_fraud_label_validation: false
  require_time_gap: false
  require_known_new_client_slices: false
qd:
  maximum_archive_size: 24
  quality_floor_relative_to_best: 0.97
oof:
  # There are no row-level predictions to store: the submission is an algorithm. Per-task raw
  # vectors play that role and live in the score store (scripts/import_nedo_results.py).
  save_row_level_predictions: false
  required_for_candidate_promotion: false
  common_final_crossfit: false
  calculate_residual_correlation: false
  calculate_effective_rank: false
  calculate_marginal_ensemble_gain: false
calibration:
  enabled: true
  minimum_records: 3
  poor_brier_threshold: 0.25
  prior_shrinkage: 0.25
preferred_state:
  # Empty, and staying empty. The world model cannot condition on this competition's context --
  # its cell (temporal 0, entity 1, decomposable 1) has no observations in the 38-competition
  # corpus (docs/world_model/prediction_nedo.md §2), so there is nothing to put here that would
  # not be the checklist wearing a world model's name.
  targets: {}
  weights: {}
ablation:
  remove: []
holdout:
  policy: strict_blind
  max_queries: 0
  reveal_scores: after_all_paired_runs
  sealed_store: .sealed
leaderboard:
  # The only hidden measurement is a real submission, and those are approved one at a time.
  public_feedback: gated_binary
  max_public_queries: 0
  query_ledger: .state/leaderboard-queries.jsonl
  sealed_store: .sealed-scores
contamination:
  policy: strict_historical
  block_kaggle_discussions: true
  block_kaggle_code: true
  block_competition_specific_github: true
  require_source_provenance: false
  # The evaluation platform runs without network access, so the worker develops without it too.
  worker_network: disabled
  obfuscate_competition_name: false
  hash_column_names: false
executor:
  # The worker develops the competition repository under an ordinary ticket. It is never told that
  # a research loop wrote the ticket, and the ticket carries no orchestrator identifiers.
  adapter: competition_repo
  target_repo: ${NEDO_REPO}
  results_subdir: results
  worker: claude:opus
  handoff: false
  retry_infrastructure_failures: 1
  result_root: .results
  workspace: ${NEDO_REPO}
  command_allowlist: [python, python3, uv, bash]
scheduler:
  max_concurrent_heavy_experiments: 1
  max_concurrent_light_experiments: 3
  memory_safety_margin: 0.25
  validate_required_artifacts: true
artifacts:
  adapter: local
  root: .runs
storage:
  event_store: jsonl
  projection: sqlite
  sqlite_path: .state/epistemic-loop.db
llm:
  adapter: cli
  model: claude-opus-5
  max_tokens: 16000
  effort: high
  structured_output_required: true
  store_raw_response: true
  cli_preset: claude
  cli_timeout_seconds: 900
  cli_max_attempts: 3
