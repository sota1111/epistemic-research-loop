# Template for a real competition run driven through ai-dev-control-plane.
# The only integration point with the control plane is the Linear issue created per experiment;
# results come back through the shared result store, never through a second API channel.
run:
  id: null
  mode: epistemic
  seed: 101
competition:
  slug: replace-with-competition-slug
  metric_direction: maximize
  primary_metric: score
  data_path: data/competition
  sample_submission: data/competition/sample_submission.csv
budgets:
  max_experiments: 40
  max_cpu_hours: 120
  max_gpu_hours: 24
  max_wall_hours: 72
  max_llm_tokens: 2000000
  max_cost: 0
  max_final_submissions: 1
loop:
  phase_policy: adaptive
  max_active_hypotheses: 30
  max_priority_hypotheses: 10
  max_consecutive_optimization_experiments: 3
  minimum_replications_for_support: 1
selection:
  cost_lambda: 0.15
  minimum_utility: 0.0
  discovery: {pragmatic: 0.20, epistemic: 0.45, robustness: 0.20, diversity: 0.15}
  consolidation: {pragmatic: 0.35, epistemic: 0.30, robustness: 0.25, diversity: 0.10}
  exploitation: {pragmatic: 0.55, epistemic: 0.15, robustness: 0.25, diversity: 0.05}
holdout:
  policy: strict_blind
  max_queries: 0
  reveal_scores: after_all_paired_runs
  sealed_store: .sealed
leaderboard:
  # Local CV drives the loop. Public-leaderboard reads are budgeted because overfitting the public
  # split is what costs private-score rank; the private score is never unsealed here.
  public_feedback: gated_binary
  max_public_queries: 3
  query_ledger: .state/leaderboard-queries.jsonl
  sealed_store: .sealed-scores
contamination:
  policy: strict_historical
  block_kaggle_discussions: true
  block_kaggle_code: true
  block_competition_specific_github: true
  require_source_provenance: true
  worker_network: disabled
executor:
  adapter: ai_dev_control_plane
  queue: kaggle-research
  retry_infrastructure_failures: 2
  linear_team_id: ${LINEAR_TEAM_ID}
  linear_project_id: ${LINEAR_PROJECT_ID}
  result_root: .results
  container_image: ghcr.io/example/kaggle-solver:latest
  dataset_mounts: [competition-data]
  workspace: .
artifacts:
  adapter: local
  root: .runs
storage:
  event_store: jsonl
  projection: sqlite
  sqlite_path: .state/epistemic-loop.db
llm:
  adapter: claude
  model: claude-opus-5
  max_tokens: 16000
  effort: high
  structured_output_required: true
  store_raw_response: true
